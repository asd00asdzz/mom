<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>โปรไฟล์</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#f5f3fb;
overflow-x:hidden;
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.logo-box{
width:78%;
height:90px;
background:white;
border-radius:30px;
box-shadow:0 5px 15px rgba(0,0,0,0.04);
}

.setting{
width:60px;
height:60px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,0.06);
font-size:24px;
color:#8d7fd1;
cursor:pointer;
}

/* PROFILE */

.profile{
padding:0 20px;
margin-top:5px;
display:flex;
flex-direction:column;
align-items:center;
}

.avatar{
width:150px;
height:150px;
border-radius:40px;
object-fit:cover;
background:#ffe4f4;
box-shadow:0 10px 20px rgba(255,120,180,0.12);
}

.username{
margin-top:18px;
font-size:28px;
font-weight:bold;
color:#444;
}

.userid{
margin-top:12px;
font-size:18px;
font-weight:bold;
color:#7b61ff;
background:white;
padding:10px 20px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.bio{
margin-top:10px;
font-size:16px;
color:#777;
text-align:center;
padding:0 20px;
}

/* POSTS */

.feed{
padding:15px;
margin-bottom:120px;
}

.post{
background:white;
border-radius:28px;
padding:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.post-top{
display:flex;
align-items:center;
gap:12px;
margin-bottom:15px;
}

.post-user-avatar{
width:55px;
height:55px;
border-radius:18px;
object-fit:cover;
cursor:pointer;
}

.post-username{
font-size:18px;
font-weight:bold;
color:#222;
cursor:pointer;
}

.post-image{
width:100%;
max-height:260px;
object-fit:cover;
border-radius:20px;
margin-bottom:12px;
}

.post-text{
font-size:20px;
font-weight:bold;
line-height:1.5;
color:#222;
margin-bottom:10px;
white-space:pre-wrap;
word-break:break-word;
}

.post-tags{
font-size:15px;
font-weight:bold;
color:#7b61ff;
margin-bottom:12px;
word-break:break-word;
}

.post-actions{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #eee;
padding-top:12px;
}

.action-btn{
flex:1;
height:50px;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
font-weight:bold;
cursor:pointer;
border-radius:15px;
}

.action-btn:active{
background:#f3f3f3;
}

.comment-box{
margin-top:15px;
display:none;
}

.comment-input{
width:100%;
height:50px;
border:none;
background:#f3f3f3;
border-radius:15px;
padding:0 15px;
font-size:16px;
outline:none;
margin-bottom:10px;
}

.comment-send{
width:100%;
height:50px;
border:none;
background:#a855f7;
color:white;
border-radius:15px;
font-size:16px;
font-weight:bold;
}

.comment-item{
background:#f5f5f5;
padding:12px;
border-radius:15px;
margin-top:8px;
font-size:15px;
word-break:break-word;
}

/* FLOAT BUTTON */

.add-post-btn{
position:fixed;
right:25px;
bottom:110px;
width:70px;
height:70px;
border-radius:50%;
background:#a855f7;
color:white;
font-size:45px;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
cursor:pointer;
z-index:999;
}

/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

.popup-box{
width:90%;
background:white;
border-radius:30px;
padding:20px;
max-height:90vh;
overflow-y:auto;
}

.popup-title{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
text-align:center;
}

.upload-box{
height:220px;
border:3px dashed #a855f7;
border-radius:25px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:20px;
color:#a855f7;
margin-bottom:20px;
cursor:pointer;
overflow:hidden;
}

.upload-box img{
width:100%;
height:100%;
object-fit:cover;
}

.textarea{
width:100%;
height:120px;
border:none;
background:#f3f3f3;
border-radius:20px;
padding:15px;
font-size:16px;
outline:none;
resize:none;
margin-bottom:15px;
}

.hashtag{
width:100%;
height:50px;
border:none;
background:#f3f3f3;
border-radius:20px;
padding:0 15px;
font-size:15px;
outline:none;
margin-bottom:20px;
}

.popup-buttons{
display:flex;
gap:15px;
}

.cancel-btn{
flex:1;
height:55px;
border:none;
border-radius:20px;
background:#eee;
font-size:17px;
font-weight:bold;
}

.post-btn{
flex:1;
height:55px;
border:none;
border-radius:20px;
background:#a855f7;
color:white;
font-size:17px;
font-weight:bold;
}

/* BOTTOM */

.bottom{
position:fixed;
left:15px;
right:15px;
bottom:15px;
background:white;
border-radius:30px;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 0 15px rgba(0,0,0,0.08);
z-index:999;
}

.bottom div{
text-align:center;
color:#777;
font-size:14px;
cursor:pointer;
}

.active{
color:#a855f7 !important;
font-weight:bold;
}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">

<div class="logo-box"></div>

<div class="setting"
onclick="window.location.href='momsetting.html'">
⚙️
</div>

</div>

<!-- PROFILE -->

<div class="profile">

<img
id="avatar"
class="avatar"
src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">

<div
class="username"
id="username">
กำลังโหลด...
</div>

<div
class="userid"
id="userid">
ID : ......
</div>

<div
class="bio"
id="bio">
...
</div>

</div>

<!-- POSTS -->

<div
class="feed"
id="feed">
</div>

<!-- FLOAT BUTTON -->

<div
class="add-post-btn"
onclick="openPopup()">
+
</div>

<!-- POPUP -->

<div
class="popup"
id="popup">

<div class="popup-box">

<div class="popup-title">
สร้างโพสต์
</div>

<div
class="upload-box"
onclick="pickImage()">

<div id="uploadText">
➕<br>
ใส่รูป
</div>

<img
id="previewImage"
style="display:none;">

</div>

<textarea
id="postText"
class="textarea"
placeholder="ใส่ข้อความ..."></textarea>

<input
type="text"
id="hashtags"
class="hashtag"
placeholder="#เกม #เท่ #ชีวิต #ความรัก #เพื่อน">

<div class="popup-buttons">

<button
class="cancel-btn"
onclick="closePopup()">
ยกเลิก
</button>

<button
class="post-btn"
onclick="createPost()">
โพสต์
</button>

</div>

</div>

</div>

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none;">

<!-- MENU -->

<div class="bottom">

<div onclick="window.location.href='mom1.html'">
🏠<br>หน้าหลัก
</div>

<div onclick="window.location.href='mom4.html'">
🪐<br>รวมโพสต์
</div>

<div class="active">
👤<br>โปรไฟล์
</div>

<div onclick="window.location.href='mom3.html'">
💬<br>แชท
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
addDoc,
query,
orderBy,
onSnapshot,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyC2DbZMOJqGYUKkc2nhYU4B-oX41SYLupU",

authDomain: "myloginapp-83797.firebaseapp.com",

projectId: "myloginapp-83797",

storageBucket: "myloginapp-83797.firebasestorage.app",

messagingSenderId: "968361508229",

appId: "1:968361508229:web:ece12a37d93ef48418d8ec"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const defaultAvatar =
"https://cdn-icons-png.flaticon.com/512/4140/4140048.png";

let currentUser = null;

let imageBase64 = "";

/* สุ่ม ID */

function generateUserID(){

return Math.floor(
100000 + Math.random() * 900000
).toString();

}

/* โหลดผู้ใช้ */

onAuthStateChanged(auth, async(user)=>{

if(user){

currentUser = user;

const ref =
doc(db,"users",user.uid);

const snap =
await getDoc(ref);

if(snap.exists()){

const data = snap.data();

if(!data.userID){

const newID =
generateUserID();

await setDoc(ref,{
userID:newID
},{merge:true});

data.userID = newID;

}

document.getElementById("avatar").src =
data.photo || defaultAvatar;

document.getElementById("username").innerText =
data.name || "ไม่มีชื่อ";

document.getElementById("bio").innerText =
data.bio || "ยังไม่มีข้อมูล";

document.getElementById("userid").innerText =
"ID : " + data.userID;

}else{

const newID =
generateUserID();

await setDoc(ref,{

uid:user.uid,

userID:newID,

name:"ผู้ใช้ใหม่",

bio:"ยังไม่มีข้อมูล",

photo:defaultAvatar

});

}

loadPosts();

}else{

window.location.href = "index.html";

}

});

/* เปิด popup */

window.openPopup = function(){

document.getElementById("popup")
.style.display = "flex";

}

window.closePopup = function(){

document.getElementById("popup")
.style.display = "none";

}

/* เลือกรูป */

window.pickImage = function(){

document.getElementById("imageInput")
.click();

}

document.getElementById("imageInput")
.addEventListener("change",function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(){

imageBase64 = reader.result;

document.getElementById("previewImage")
.src = imageBase64;

document.getElementById("previewImage")
.style.display = "block";

document.getElementById("uploadText")
.style.display = "none";

}

reader.readAsDataURL(file);

});

/* โพสต์ */

window.createPost = async function(){

const text =
document.getElementById("postText")
.value;

const hashtags =
document.getElementById("hashtags")
.value;

if(text.trim()=="" && imageBase64==""){

alert("ใส่รูปหรือข้อความ");

return;

}

await addDoc(
collection(db,"posts"),
{
uid:currentUser.uid,
text:text,
hashtags:hashtags,
image:imageBase64,
likes:[],
comments:[],
time:Date.now()
}
);

document.getElementById("postText")
.value = "";

document.getElementById("hashtags")
.value = "";

imageBase64 = "";

document.getElementById("previewImage")
.style.display = "none";

document.getElementById("uploadText")
.style.display = "block";

closePopup();

}

/* โหลดโพสต์ */

function loadPosts(){

const q = query(
collection(db,"posts"),
orderBy("time","desc")
);

onSnapshot(q, async(snap)=>{

const feed =
document.getElementById("feed");

feed.innerHTML = "";

for(const docx of snap.docs){

const data = docx.data();

if(data.uid != currentUser.uid)
continue;

let ownerName = "ผู้ใช้";

let ownerPhoto = defaultAvatar;

try{

const userRef =
doc(db,"users",data.uid);

const userSnap =
await getDoc(userRef);

if(userSnap.exists()){

const userData =
userSnap.data();

ownerName =
userData.name || "ผู้ใช้";

ownerPhoto =
userData.photo || defaultAvatar;

}

}catch(e){}

let imageHTML = "";

if(data.image){

imageHTML = `
<img
class="post-image"
src="${data.image}">
`;

}

let commentsHTML = "";

if(data.comments){

data.comments.forEach(c=>{

commentsHTML += `
<div class="comment-item">
💬 ${c}
</div>
`;

});

}

const liked =
data.likes &&
data.likes.includes(currentUser.uid);

const post =
document.createElement("div");

post.className = "post";

post.innerHTML = `

<div class="post-top">

<img
class="post-user-avatar"
src="${ownerPhoto}"
onclick="openProfile('${data.uid}')">

<div
class="post-username"
onclick="openProfile('${data.uid}')">

${ownerName}

</div>

</div>

${imageHTML}

<div class="post-text">
${data.text || ""}
</div>

<div class="post-tags">
${data.hashtags || ""}
</div>

<div class="post-actions">

<div
class="action-btn"
onclick="likePost('${docx.id}')">

${liked ? "❤️" : "🤍"}
${data.likes ? data.likes.length : 0}

</div>

<div
class="action-btn"
onclick="toggleComment('${docx.id}')">

💬 คอมเมนต์

</div>

<div
class="action-btn"
onclick="sharePost('${docx.id}')">

🔗 แชร์

</div>

</div>

<div
class="comment-box"
id="commentBox-${docx.id}">

<input
class="comment-input"
id="comment-${docx.id}"
placeholder="พิมพ์คอมเมนต์...">

<button
class="comment-send"
onclick="sendComment('${docx.id}')">

ส่งคอมเมนต์

</button>

${commentsHTML}

</div>

`;

feed.appendChild(post);

}

});

}

/* เปิดโปรไฟล์ */

window.openProfile = function(uid){

window.location.href =
"profile.html?uid=" + uid;

}

/* กดใจ */

window.likePost = async function(id){

const ref =
doc(db,"posts",id);

const snap =
await getDoc(ref);

const data =
snap.data();

let likes =
data.likes || [];

if(likes.includes(currentUser.uid)){

return;

}

likes.push(currentUser.uid);

await updateDoc(ref,{
likes:likes
});

}

/* เปิดคอมเมนต์ */

window.toggleComment = function(id){

const box =
document.getElementById(
"commentBox-"+id
);

if(box.style.display=="block"){

box.style.display = "none";

}else{

box.style.display = "block";

}

}

/* ส่งคอมเมนต์ */

window.sendComment = async function(id){

const input =
document.getElementById(
"comment-"+id
);

const text =
input.value;

if(text.trim()=="")
return;

const ref =
doc(db,"posts",id);

const snap =
await getDoc(ref);

const data =
snap.data();

let comments =
data.comments || [];

comments.push(text);

await updateDoc(ref,{
comments:comments
});

input.value = "";

}

/* แชร์ */

window.sharePost = function(id){

const link =
window.location.origin +
"/post.html?id=" + id;

navigator.clipboard.writeText(link);

alert("คัดลอกลิงก์แล้ว");

}

/* กันซูม */

document.addEventListener(
'gesturestart',
function (e) {
e.preventDefault();
});

let lastTouchEnd = 0;

document.addEventListener(
'touchend',
function (event) {

const now =
(new Date()).getTime();

if (now - lastTouchEnd <= 300) {
event.preventDefault();
}

lastTouchEnd = now;

}, false);

</script>

</body>
  </html>
